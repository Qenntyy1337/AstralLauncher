[package]
name = "astral-launcher"
version = "1.0.0"
description = "AstralLauncher - modern Minecraft launcher"
authors = ["AstralLauncher"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json", "gzip"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
